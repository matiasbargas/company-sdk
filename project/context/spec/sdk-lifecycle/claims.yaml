      then: "1 | 1 | 0 + hint | 1 'No release ID' | 2 'invalid --release-id' | 1 'No history.md entry found'"
    sources:
      - { file: scripts/github.js, lines: "167-176, 196-274, 276-284" }
    conformance: [cap-life-github-003]

  - id: cap-life-github-004
    kind: capability
