  - id: cap-life-version-003
    kind: capability
    status: built
    statement: "`sdk-version <dir> set <id>` validates vYYYY.Q[1-4].N (exit 2 and unchanged otherwise), writes .sdkrc + current-status, and logs a history entry only when a previous version existed ('(none) → id')."
    acceptance:
      given: "existing v2026.Q2.1 | no version"
      when: "set v2026.Q3.5 | set 2026.Q3.5 | set v2026.Q5.1 | set (no id)"
      then: "'v2026.Q2.1 → v2026.Q3.5' + history entry | exit 2 | exit 2 | exit 2; from nothing: '(none) → v…', history unchanged"
    sources:
      - { file: scripts/version.js, lines: "176-199" }
    conformance: [cap-life-version-003]

  - id: cap-life-version-004
    kind: capability
    status: built
    statement: "`sdk-version` usage errors exit 2 (bump without/with unknown kind, unknown subcommand); bump with no current version exits 1; failed commands leave .sdkrc unchanged."
    acceptance:
      given: "a versioned dir and an unversioned dir"
      when: "bump | bump huge | frobnicate | bump patch (unversioned)"
      then: "2 | 2 | 2 | 1; .sdkrc releaseId unchanged"
    sources:
      - { file: scripts/version.js, lines: "145-160, 202-203" }
    conformance: [cap-life-version-004]

  # ──────────────────────────────────────────────────────────────────── sdk-ship (scripts/ship.js)

  - id: cap-life-ship-001
    kind: capability
    status: built
    statement: "`sdk-ship` exits 1 without tagging when <project-dir>/<release-id> are missing, the id is not vYYYY.QN.N, the dir is missing, history.md is missing, or history.md has no '## [<id>]' / '## <id>' entry ('SHIP BLOCKED')."
    acceptance:
      given: "each invalid input in a temp git repo"
      when: "node scripts/ship.js <dir> <id>"
      then: "exit 1 with the named message; git tag -l empty"
    sources:
      - { file: scripts/ship.js, lines: "64-108" }
      - { file: scripts/lib/release-notes.js }
    conformance: [cap-life-ship-001]

  - id: cap-life-ship-002
    kind: capability
    status: built
    statement: "`sdk-ship <dir> <id> --dry-run` (no clean tree required) exits 0, reports the history/validate checks, and previews GitHub release notes built from the release's history section only: '### What shipped' (COMPLETED/shipped/Done/delivered bullets), '### Decisions made' (**Decision:** lines / approved table rows), '### Full log'; no tag is created."
    acceptance:
      given: "history '## [v2026.Q2.1] …' with '- Mission A COMPLETED' and '**Decision:** Use Postgres', followed by another ## section; a dirty file"
      when: "node scripts/ship.js <dir> v2026.Q2.1 --dry-run"
      then: "exit 0; '(dry run) sdk-ship', 'history.md: entry found ✓', 'sdk-validate: clean ✓'; notes sections as stated; next-section text absent; git tag -l empty"
    sources:
      - { file: scripts/ship.js, lines: "141-155" }
      - { file: scripts/lib/release-notes.js }
    conformance: [cap-life-ship-002]

  - id: cap-life-ship-003
    kind: capability
    status: built
    statement: "`sdk-ship` runs sdk-validate first: any warning blocks a real ship (exit 1, 'SHIP BLOCKED — documentation issues found', warnings listed); --dry-run shows the warnings as 'would block' and exits 0."
    acceptance:
      given: "a committed project missing general-requirements.md"
      when: "ship <dir> <id> | ship <dir> <id> --dry-run"
      then: "exit 1 naming 'general-requirements.md is missing' | exit 0 with '1 warning(s) — would block'; no tag"
    sources:
      - { file: scripts/ship.js, lines: "110-127" }
    conformance: [cap-life-ship-003]

  - id: cap-life-ship-004
    kind: capability
    status: built
    statement: "A real `sdk-ship` refuses a dirty working tree (exit 1, 'Working tree is not clean', uncommitted files listed) and creates no tag."
    acceptance:
      given: "an untracked file in an otherwise shippable repo"
      when: "ship <dir> <id>"
      then: "exit 1; stderr names the file; git tag -l empty"
    sources:
      - { file: scripts/ship.js, lines: "129-139" }
      - { file: scripts/lib/git.js, section: assertCleanTree }
    conformance: [cap-life-ship-004]

  - id: cap-life-ship-005
    kind: capability
    status: built
    statement: "`sdk-ship` is atomic: it creates an annotated tag and pushes it to origin; if the push fails the local tag is deleted (exit 1, 'SHIP FAILED … local tag rolled back'); an existing tag blocks with a delete hint."
    acceptance:
      given: "a shippable repo whose origin is a nonexistent local path (offline) | a pre-existing tag"
      when: "ship <dir> v2026.Q2.1"
      then: "exit 1 'local tag rolled back' and git tag -l empty | exit 1 'already exists'"
    sources:
      - { file: scripts/ship.js, lines: "157-183" }
      - { file: scripts/lib/git.js, section: createAndPushTag }
    conformance: [cap-life-ship-005]

  - id: cap-life-ship-006
    kind: capability
    status: built
    statement: "The remediation `sdk-ship` prints when a release entry is missing (`sdk-doc decision history.md --decision \"Release <id>\" …`) produces an entry that `sdk-ship` then accepts."
    fixed_note: "2026-11-14: lib/release-notes.js matchReleaseDecision accepts '### Decision: Release <id>' (to the next ##/### heading; no prefix match on <id>0); sdk-ship and sdk-github release both fall back to it."
    acceptance:
      given: "a history.md without an entry; the printed sdk-doc command is run"
      when: "ship <dir> <id> --dry-run"
      then: "exit 0 (entry found)"
    sources:
      - { file: scripts/ship.js, lines: "88-108" }
      - { file: scripts/lib/release-notes.js }
      - { file: scripts/github.js, lines: "170-181" }
      - { file: scripts/commands/decision.js }
    conformance: [cap-life-ship-006]

  - id: cap-life-ship-007
    kind: capability
    status: unpinned
    statement: "On a clean, validated repo with a reachable origin, `sdk-ship` pushes the annotated tag 'Release <id>', prints the release notes and '✅ <id> shipped', exits 0."
    acceptance:
      given: "a shippable repo with a writable origin"
      when: "ship <dir> <id>"
      then: "exit 0; origin has tag <id>; stdout contains the notes and '<id> shipped'"
    sources:
      - { file: scripts/ship.js, lines: "157-183" }
    conformance: [cap-life-ship-007]

  # ──────────────────────────────────────────────────────────────── sdk-github (scripts/github.js)

  - id: cap-life-github-001
    kind: capability
    status: built
    statement: "`sdk-github` offline argument handling: --help exits 0 naming TEAM_SDK_GITHUB_TOKEN; missing or nonexistent project dir → exit 2; unknown subcommand → exit 2; `link` with --repo not in owner/repo form → exit 2 before any auth or network, .sdkrc untouched."
    acceptance:
      given: "no network, dummy token"
      when: "github.js --help | status | status <missing> | frob <dir> | link <dir> --repo no-slash"
