    conformance: [cap-life-github-001]

  - id: cap-life-github-002
    kind: capability
    status: built
    statement: "`sdk-github` authenticates only with TEAM_SDK_GITHUB_TOKEN: without it every network command exits 1; if only GITHUB_TOKEN is set it explains the Actions-token collision instead of using it."
    acceptance:
      given: "TEAM_SDK_GITHUB_TOKEN unset (GITHUB_TOKEN unset | set)"
      when: "sync-issues | release | status <dir>"
      then: "exit 1 'TEAM_SDK_GITHUB_TOKEN is not set' | 'GITHUB_TOKEN is set but TEAM_SDK_GITHUB_TOKEN is not'"
    sources:
      - { file: scripts/github.js, lines: "29-45" }
    conformance: [cap-life-github-002]

  - id: cap-life-github-003
    kind: capability
    status: built
    statement: "`sdk-github` pre-network guards: sync-issues/release with no linked repo (.sdkrc github.repo) exit 1; status with no linked repo prints the link hint (exit 0); release with no id (flag or .sdkrc) exits 1; a malformed --release-id (not vYYYY.QN.N, or no value) exits 2; release with no '## [<id>]' or '### Decision: Release <id>' history entry exits 1."
    fixed_note: "2026-11-14: the RELEASE_RE validator github.js defined but never used now guards --release-id (exit 2, before auth/network)."
    acceptance:
      given: "dummy token; unlinked dir | linked dir without releaseId | malformed id | history with unbracketed '## <id>'"
