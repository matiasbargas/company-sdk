      given: ".sdkrc releaseId | only current-status Release | neither | missing dir"
      when: "node scripts/version.js <dir>"
      then: "stdout == the id | hint, exit 0 | exit 2"
    sources:
      - { file: scripts/version.js, lines: "68-77, 133-143" }
    conformance: [cap-life-version-001]

  - id: cap-life-version-002
    kind: capability
    status: built
    statement: "`sdk-version <dir> bump patch|minor|major` increments vYYYY.QN.N (patch .N+1; minor next quarter .1, Q4 rolls to next year Q1; major next year Q1.1), writes .sdkrc releaseId (other keys preserved), rewrites current-status '**Release:**', appends '## Version Bump — old → new' to history.md, and prints 'old → new'."
    acceptance:
      given: "v2026.Q4.3 / v2026.Q2.3"
