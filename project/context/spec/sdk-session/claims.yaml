# Layer B capabilities — sdk-session (session & quality bins)
#
# What sdk-pre-tag, sdk-status, sdk-next, sdk-resume, sdk-health, sdk-validate, sdk-gate-check,
# sdk-ops, sdk-daemon, sdk-consult and sdk-memory promise today, stated against their public
# interface (args, exit codes, files written, stdout/stderr lines), independent of scripts/.
#
# Conformance: scripts/lib/test-cap-session.js (black-box, fixture projects in os.tmpdir()).
# `built`  ⇒ a `@covers <id>` block in that file passes.
# `defect` ⇒ the test pins CURRENT behaviour that differs from the help/docs (`// DEFECT:`); fix
#            the source, flip the assertion, then set `built`.
#
# Not duplicated here (see project/context/spec/sdk-core/claims.yaml):
#   cap-sdk-gate-001       CLO+CISO placeholder/Gate Status/pending-item rules of sdk-gate-check
#   cap-sdk-staleness-001  commit/iteration-based staleness primitives (used by pre-tag + health)
#   cap-sdk-state-001      header-aware current-status.md parser (used by status + pre-tag)
#   cap-sdk-mapgate-001    material/exempt classification (used by health document-first drift)

claims:
  # ─── sdk-pre-tag ───────────────────────────────────────────────────────────
  - id: cap-sess-pretag-001
    kind: capability
    status: built
    statement: "`sdk-pre-tag` prints usage and exits 0 on --help or no args, and exits 2 when the project directory does not exist."
    acceptance:
      - given: "no arguments, or --help"
        when: "sdk-pre-tag runs"
        then: "stdout contains Usage with --fix and --json; exit 0"
      - given: "a path that does not exist"
        when: "sdk-pre-tag <path>"
        then: "stderr 'project directory not found'; exit 2"
    sources:
      - file: scripts/pre-tag.js
        lines: 576-611
    conformance: [cap-sess-pretag-001]

  - id: cap-sess-pretag-002
    kind: capability
    status: built
    statement: "The canonical release is .sdkrc `releaseId`, else current-status.md `**Release:**`; `--release-id X` that differs from it aborts with exit 1 before any check runs."
    acceptance:
      - given: ".sdkrc releaseId v2026.Q4.5 and current-status Release v2026.Q4.1"
        when: "sdk-pre-tag <dir> --release-id v2026.Q4.1"
        then: "stderr 'does not match canonical v2026.Q4.5'; exit 1"
      - given: "a matching --release-id"
        when: "sdk-pre-tag <dir> --release-id <canonical> --json"
        then: "the review runs and JSON releaseId equals it"
    sources:
      - file: scripts/pre-tag.js
        lines: 151-157, 613-623
    conformance: [cap-sess-pretag-002]

  - id: cap-sess-pretag-003
    kind: capability
    status: built
    statement: "`--json` prints one JSON object `{clean, releaseId, fixed, issues, byOwner}` where byOwner maps a responsible role to `[{type, file, message}]` and the lists total `issues`; exit 1 while issues remain."
    acceptance:
      - given: "a content-clean project without context-manifest.json"
        when: "sdk-pre-tag <dir> --json"
        then: "clean=false, exactly one health issue 'context-manifest.json not found', exit 1"
    sources:
      - file: scripts/pre-tag.js
        lines: 489-505, 639-641
    conformance: [cap-sess-pretag-003]

  - id: cap-sess-pretag-004
    kind: capability
    status: built
    statement: "The text report groups remaining issues under COHERENCE / COHESION / VALIDATE / HEALTH headings (issue lines on stderr, tagged `[file]`), then a TEAM DISPATCH listing each responsible role with its issue count, then a footer count."
    acceptance:
      - given: "a project with an unknown Next Agent role and no manifest"
        when: "sdk-pre-tag <dir>"
        then: "stdout has '── COHERENCE', '── HEALTH', '── TEAM DISPATCH', 'Coordinator — 2 issues to resolve', '2 issues require agent action before tagging.'; exit 1"
    sources:
      - file: scripts/pre-tag.js
        lines: 52-72, 507-563
    conformance: [cap-sess-pretag-004]

  - id: cap-sess-pretag-005
    kind: capability
    status: built
    statement: "Coherence: a release ID in current-status.md that differs from .sdkrc releaseId is a fixable coherence issue dispatched to the Coordinator."
    acceptance:
      - given: "current-status Release v2026.Q4.1, .sdkrc releaseId v2026.Q4.2"
        when: "sdk-pre-tag <dir> --json"
        then: "a coherence issue 'Release ID mismatch: current-status.md says \"v2026.Q4.1\", .sdkrc says \"v2026.Q4.2\"' under Coordinator"
    sources:
      - file: scripts/pre-tag.js
        lines: 186-207
    conformance: [cap-sess-pretag-005]

  - id: cap-sess-pretag-006
    kind: capability
    status: built
    statement: "Coherence: every mission in current-status.md Active Missions must be mentioned (case-insensitive substring) somewhere in product-requirements.md, else a coherence issue for the PM."
    acceptance:
      - given: "active mission 'Checkout flow' absent from product-requirements.md"
        when: "sdk-pre-tag <dir> --json"
        then: "byOwner.PM has 'Mission \"Checkout flow\" is active ... no corresponding entry'"
      - given: "product-requirements.md mentions 'checkout FLOW' in prose"
        then: "no mission issue"
    sources:
      - file: scripts/pre-tag.js
        lines: 209-227
    conformance: [cap-sess-pretag-006]

  - id: cap-sess-pretag-007
    kind: capability
    status: built
    statement: "Coherence: history.md must contain the current release ID, else a coherence issue telling the Coordinator to log the release decision."
    acceptance:
      - given: "history.md that never names v2026.Q4.1"
        when: "sdk-pre-tag <dir> --json"
        then: "issue 'No history.md entry found for release v2026.Q4.1' (file history.md)"
    sources:
      - file: scripts/pre-tag.js
        lines: 229-242
    conformance: [cap-sess-pretag-007]

  - id: cap-sess-pretag-008
    kind: capability
    status: built
    statement: "Coherence: each role in the Next Agent To Activate table must be a recognised role (agent names in parentheses are ignored), else a coherence issue."
    acceptance:
      - given: "role cell 'Wizard (Ana Lagos)'"
        then: "issue '\"Next Agent To Activate\" names \"Wizard (Ana Lagos)\" — not a recognized role'"
      - given: "role cell 'Staff Engineer (Tariq Bishkek)'"
        then: "no role issue"
    sources:
      - file: scripts/pre-tag.js
        lines: 244-270
    conformance: [cap-sess-pretag-008]

  - id: cap-sess-pretag-009
    kind: capability
    status: built
    statement: "Cohesion: flags a Done/complete/shipped mission still in Active Missions, a product-requirements item present in both Done and Pending, and any `## ` history.md entry without a Made by attribution."
    acceptance:
      - given: "an Active Missions row with status Done, an item in Done and Pending, a history entry with no Made by"
        when: "sdk-pre-tag <dir> --json"
        then: "three cohesion issues; history entries that do have Made by are not flagged"
    sources:
      - file: scripts/pre-tag.js
        lines: 278-359
    conformance: [cap-sess-pretag-009]

  - id: cap-sess-pretag-010
    kind: capability
    status: built
    statement: "Validate: every sdk-validate warning is surfaced verbatim as a `validate` issue (file `_validate`)."
    acceptance:
      - given: "engineering-requirements.md containing [RELEASE] on line 3"
        then: "exactly one validate issue 'WARN  engineering-requirements.md ... unfilled placeholder on line 3'"
    sources:
      - file: scripts/pre-tag.js
        lines: 364-367
    conformance: [cap-sess-pretag-010]

  - id: cap-sess-pretag-011
    kind: capability
    status: built
    statement: "Health: current-status.md more commits behind than `.sdkrc limits.statusStaleCommits` is a health issue; outside git staleness is not measured."
    acceptance:
      - given: "a git repo, statusStaleCommits 2, three commits since current-status.md changed"
        then: "health issue 'current-status.md is 3 commits behind (threshold: 2)'"
      - given: "two commits behind, or no git repo"
        then: "no staleness issue"
    sources:
      - file: scripts/pre-tag.js
        lines: 375-387
    conformance: [cap-sess-pretag-011]

  - id: cap-sess-pretag-012
    kind: capability
    status: built
    statement: "Health: a missing .sdkrc, malformed .sdkrc JSON, or a .sdkrc with neither sdkPath nor releaseId is a health issue on `.sdkrc`."
    sources:
      - file: scripts/pre-tag.js
        lines: 407-429
    conformance: [cap-sess-pretag-012]

  - id: cap-sess-pretag-013
    kind: capability
    status: built
    statement: "`--fix` rewrites current-status.md `**Release:**` to the .sdkrc releaseId, counts it in `fixed`, and drops it from the remaining issues; without --fix no file is modified."
    acceptance:
      - given: "release drift v2026.Q4.1 (status) vs v2026.Q4.2 (.sdkrc)"
        when: "sdk-pre-tag <dir> --fix --json"
        then: "current-status.md reads '**Release:** v2026.Q4.2'; fixed=1; a re-run reports no drift"
    sources:
      - file: scripts/pre-tag.js
        lines: 190-207, 436-475
    conformance: [cap-sess-pretag-013]

  - id: cap-sess-pretag-014
    kind: capability
    status: built
    statement: "`--fix` creates a missing required file from project-template/ and reports it as auto-fixed, removing it from the issues that remain."
    fixed_note: "2026-11-14: applyFixes records the fix on the original issue object, so printReport and the exit code subtract the same set; the created file is no longer listed as unresolved and the footer agrees with the exit code. (The created stub is the template verbatim, so its placeholders surface as validate issues on the next run; that is intended: an agent fills it.)"
    sources:
      - file: scripts/pre-tag.js
        lines: 437-477, 490-491, 647-649
    conformance: [cap-sess-pretag-014]

  - id: cap-sess-pretag-015
    kind: capability
    status: built
    statement: "A project with a fresh context-manifest.json and no other findings gets 'All checks passed. Ready to tag.' and exit 0 (help: 'Exit 0 if clean')."
    fixed_note: "2026-11-14: the undefined `staleHours` reference (a chapter-6 regression) is fixed; manifest staleness is commit-based."
    sources:
      - file: scripts/pre-tag.js
        lines: 389-405, 520-523
    conformance: [cap-sess-pretag-015]

  - id: cap-sess-pretag-016
    kind: capability
    status: built
    statement: "With --json, every outcome (including a --release-id mismatch) is reported as machine-readable output."
    fixed_note: "2026-11-14: with --json, a --release-id mismatch prints {clean:false, releaseId, canonical, error, fixed:0, issues:1, byOwner} on stdout and exits 1."
    sources:
      - file: scripts/pre-tag.js
        lines: 615-632
    conformance: [cap-sess-pretag-016]

