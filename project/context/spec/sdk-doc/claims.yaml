  # ─── bus (protocol §1) ──────────────────────────────────────────────────────
  - id: cap-doc-bus-001
    kind: capability
    status: built
    statement: 'bus appends a timestamped entry to bus-log.md (creating it with an append-only header) and prints the §1 formatted message with RELEASE from .sdkrc (unknown without it); PRIORITY defaults to INFO.'
    acceptance:
      - given: '.sdkrc releaseId v2026.Q4.1, no bus-log.md'
        when: 'sdk-doc bus <dir> --from PM --to Designer --message "Scope ready"'
        then: 'bus-log.md has # Bus Log header and [YYYY-MM-DD HH:MM] FROM: PM → TO: Designer | PRIORITY: INFO | RELEASE: v2026.Q4.1; stdout FROM/TO/RELEASE/PRIORITY/MESSAGE block; exit 0'
    sources: [{file: scripts/commands/bus.js, lines: '80-114,138-141'}]
    conformance: [cap-doc-bus-001]

  - id: cap-doc-bus-002
    kind: capability
    status: built
    statement: 'bus rejects (exit 1, nothing logged) a message missing --from/--to/--message or with a priority other than INFO, DECISION NEEDED, BLOCKER.'
    acceptance:
      - given: 'any project'
        when: 'bus --from PM --to CTO --message x --priority URGENT'
        then: 'stderr --priority must be INFO, DECISION NEEDED, or BLOCKER; exit 1; bus-log.md unchanged'
    sources: [{file: scripts/commands/bus.js, lines: '35-50'}]
    conformance: [cap-doc-bus-002]

  - id: cap-doc-bus-003
    kind: capability
    status: built
    statement: 'DECISION NEEDED requires --decision-by YYYY-MM-DD; any non-INFO priority requires --escalation <role>; both are printed after MESSAGE and logged.'
    acceptance:
      - given: 'DECISION NEEDED without --decision-by (or a non-ISO date)'
        when: 'sdk-doc bus ...'
        then: 'stderr DECISION NEEDED requires --decision-by YYYY-MM-DD; exit 1'
      - given: 'BLOCKER without --escalation'
        when: 'sdk-doc bus ...'
        then: 'stderr BLOCKER requires --escalation <role> ...; exit 1'
      - given: 'valid --decision-by 2026-12-01 --escalation Coordinator'
        when: 'sdk-doc bus ...'
        then: 'stdout MESSAGE ... then DECISION BY: 2026-12-01 then ESCALATION: Coordinator; same lines in bus-log.md'
    sources: [{file: scripts/commands/bus.js, lines: '55-62,97-105'}]
    conformance: [cap-doc-bus-003]

  - id: cap-doc-bus-004
    kind: capability
    status: built
    statement: 'CONTEXT-REQUEST is a TAG on INFO only; the legacy --priority "CONTEXT REQUEST" is converted to INFO + TAG CONTEXT-REQUEST (keeping any other tag) with a deprecation note on stderr.'
    acceptance:
      - given: '--priority BLOCKER --tag CONTEXT-REQUEST'
        when: 'sdk-doc bus ...'
        then: 'stderr CONTEXT-REQUEST tag requires PRIORITY: INFO; exit 1'
      - given: '--priority "CONTEXT REQUEST" --tag RESEARCH'
        when: 'sdk-doc bus ...'
        then: 'exit 0; PRIORITY: INFO; TAG: CONTEXT-REQUEST, RESEARCH; stderr ... is deprecated ...'
    sources: [{file: scripts/commands/bus.js, lines: '23-28,51-54'}]
    conformance: [cap-doc-bus-004]

  - id: cap-doc-bus-005
    kind: capability
    status: built
    statement: 'SOLUTION_CLASS (KNOWN|EXPLORATORY|HYBRID) is required on DECISION NEEDED/BLOCKER from technical roles (CTO, Mario, Chief Engineer, EM, Staff Engineer, Coordinator), optional otherwise, and validated when present; COST_SIGNAL/TIME_SIGNAL are passed through.'
    acceptance:
      - given: '--from CTO --priority BLOCKER --escalation CEO, no --solution-class'
        when: 'sdk-doc bus ...'
        then: 'stderr SOLUTION_CLASS is required on BLOCKER messages from CTO; exit 1'
      - given: '--solution-class MAYBE'
        when: 'sdk-doc bus ...'
        then: 'stderr --solution-class must be KNOWN, EXPLORATORY, or HYBRID; exit 1'
      - given: 'valid KNOWN + --cost-signal HIGH --time-signal 4h'
        when: 'sdk-doc bus ...'
        then: 'stdout SOLUTION_CLASS / COST_SIGNAL / TIME_SIGNAL lines before MESSAGE; log has | SOL: KNOWN |'
    sources: [{file: scripts/commands/bus.js, lines: '64-78,93-96'}]
    conformance: [cap-doc-bus-005]

  - id: cap-doc-bus-006
    kind: capability
    status: built
    statement: 'A FRAMING-CHALLENGE tag requires DECISION NEEDED or BLOCKER.'
    acceptance:
      - given: '--tag FRAMING-CHALLENGE, default priority'
        when: 'sdk-doc bus ...'
        then: 'stderr FRAMING-CHALLENGE tag requires PRIORITY: DECISION NEEDED or BLOCKER, not INFO.; exit 1'
    sources: [{file: scripts/commands/bus.js, lines: '41-44'}]
    conformance: [cap-doc-bus-006]

  - id: cap-doc-bus-007
    kind: capability
    status: built
    statement: 'bus reports what the message implies: an intent action (script, writes, params), a routing suggestion, or "No action implied — pure communication".'
