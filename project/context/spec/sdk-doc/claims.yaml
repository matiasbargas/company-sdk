        then: 'Dissolved row | Fatima Nairobi | CLO | M3 | Lena Tbilisi (EM) | <today> | Mission complete |; current 1, total 2; other agent still active'
    sources: [{file: scripts/commands/dissolve.js, lines: '26-69'}]
    conformance: [cap-doc-dissolve-001]

