    sources: [{file: scripts/commands/pod-update.js, lines: '11-36'}]
    conformance: [cap-doc-pod-update-001]

  - id: cap-doc-pod-update-002
    kind: capability
    status: built
    statement: 'pod-update on a known mission rewrites its Status and Next action cells in place (no duplicate row); missing options exit 1.'
    acceptance:
      - given: 'an Auth Service row'
        when: 'pod-update --mission "Auth Service" --status Blocked --next "CISO: review"'
        then: 'the single row shows Blocked / CISO: review; stdout Updated mission'
    sources: [{file: scripts/commands/pod-update.js, lines: '6-26'}]
    conformance: [cap-doc-pod-update-002]

  - id: cap-doc-pod-update-003
    kind: capability
