# Layer B capabilities — sdk-doc (scripts/doc.js and its 22 registered subcommands)
#
# What `sdk-doc` promises at its public interface (argv, files written, exit codes, stdout/stderr),
# independent of how scripts/commands/*.js implements it (protocol.md §30, "Specs outlive implementations").
# Black-box conformance: scripts/lib/test-cap-doc.js runs `node scripts/doc.js ...` against fixture
# projects in os.tmpdir(). Section addressing, scaffolding, and the core iteration lifecycle live in
# sdk-core (cap-sdk-sections-001, cap-sdk-iteration-001); cap-doc-iteration-* covers the gaps only.
#
# status: built = covering test passes · unpinned = exists, untested · defect = a test proved the
# behaviour differs from help/docs (defect_note says how; the test pins current behaviour with `// DEFECT:`).

claims:
  # ─── dispatcher ─────────────────────────────────────────────────────────────
  - id: cap-doc-dispatch-001
    kind: capability
    status: built
    statement: 'sdk-doc prints usage on no args (exit 0) or --help, and exits 1 on an unknown command or a file command without its file argument.'
    acceptance:
      - given: 'no arguments'
        when: 'node scripts/doc.js'
        then: 'stdout contains Usage:, exit 0'
      - given: 'an unregistered command'
        when: 'node scripts/doc.js frobnicate x.md'
        then: 'stderr Unknown command: "frobnicate", exit 1'
      - given: 'a file command (read) with no file'
        when: 'node scripts/doc.js read'
        then: 'usage printed, exit 1'
    sources: [{file: scripts/doc.js, lines: '14-66'}]
    conformance: [cap-doc-dispatch-001]

  - id: cap-doc-dispatch-002
    kind: capability
    status: built
    statement: 'Every file-writing command honours --dry-run by printing a DRY RUN preview and modifying no file.'
    acceptance:
      - given: 'any writing command'
        when: 'invoked with --dry-run'
        then: 'stdout shows DRY RUN and no file or directory changes (pinned: append, add-item, pod-update, study create, session save/promote/clean, domain add/update, disagreement open/resolve, iteration create)'
    sources: [{file: scripts/doc.js, lines: '15,130-131'}, {file: scripts/lib/doc-utils.js, lines: '54-63'}]
    conformance: [cap-doc-dispatch-002]

  # ─── list / read ────────────────────────────────────────────────────────────
  - id: cap-doc-list-001
    kind: capability
    status: built
    statement: 'list prints every markdown heading of a file, indented two spaces per level below H1.'
    acceptance:
      - given: 'a file with #, ##, ### headings'
        when: 'sdk-doc list <file>'
        then: 'stdout lists each heading in order, ## indented 2 spaces, ### indented 4; exit 0'
    sources: [{file: scripts/commands/list.js, lines: '5-17'}]
    conformance: [cap-doc-list-001]

  - id: cap-doc-read-001
    kind: capability
    status: built
    statement: 'read prints one section (heading, body and subsections) up to the next heading of the same or higher level; matching is case-insensitive.'
    acceptance:
      - given: '## One with a ### Sub, followed by ## Two'
        when: 'sdk-doc read <file> --section "## One"'
        then: 'stdout has One and Sub bodies but not Two; exit 0'
    sources: [{file: scripts/commands/read-cmd.js, lines: '5-20'}]
    conformance: [cap-doc-read-001]

  - id: cap-doc-read-002
    kind: capability
    status: built
    statement: 'read fails loudly: missing --section, a missing section, or a missing file each exit 1 with a message.'
    acceptance:
      - given: 'a file without ## Nope'
        when: 'sdk-doc read <file> --section "## Nope"'
        then: 'stderr Section not found: "## Nope", exit 1'
      - given: 'a path that does not exist'
        when: 'sdk-doc read <missing> --section x'
        then: 'stderr File not found:, exit 1'
    sources: [{file: scripts/commands/read-cmd.js, lines: '6-16'}, {file: scripts/lib/doc-utils.js, lines: '42-49'}]
    conformance: [cap-doc-read-002]

  # ─── append / rewrite / add-item ────────────────────────────────────────────
  - id: cap-doc-append-001
    kind: capability
    status: built
    statement: 'append inserts content at the end of the named section, before the next heading, leaving other sections intact.'
    acceptance:
      - given: '## One then ## Two'
        when: 'sdk-doc append <file> --section "## One" --content "added line"'
        then: 'added line sits after One body and before ## Two; stdout Appended to section "## One"'
    sources: [{file: scripts/commands/append.js, lines: '32-46'}]
    conformance: [cap-doc-append-001]

  - id: cap-doc-append-002
    kind: capability
    status: built
    statement: 'append to a missing plain (non-path) section creates it at the end of the file; missing --section/--content exits 1.'
    acceptance:
      - given: 'no ## Three'
        when: 'sdk-doc append <file> --section "## Three" --content third'
        then: 'file ends with ## Three + third; stdout Created section'
    sources: [{file: scripts/commands/append.js, lines: '6-30'}]
    conformance: [cap-doc-append-002]

  - id: cap-doc-append-003
    kind: capability
    status: built
    statement: 'append --dry-run previews the result and leaves the file unchanged.'
    acceptance:
      - given: 'any file'
        when: 'sdk-doc append <file> --section "## One" --content dry --dry-run'
        then: 'stdout DRY RUN — no files modified; file bytes unchanged'
    sources: [{file: scripts/lib/doc-utils.js, lines: '54-63'}]
    conformance: [cap-doc-append-003]

  - id: cap-doc-rewrite-001
    kind: capability
    status: built
    statement: 'rewrite replaces a section body (including its subsections), keeping the heading and the following sections.'
    acceptance:
      - given: '## One with content, then ## Two'
        when: 'sdk-doc rewrite <file> --section "## One" --content replaced'
        then: 'file has ## One, replaced, ## Two; old body gone; stdout Rewrote section'
    sources: [{file: scripts/commands/rewrite.js, lines: '21-33'}]
    conformance: [cap-doc-rewrite-001]

  - id: cap-doc-rewrite-002
    kind: capability
    status: built
    statement: 'rewrite of a missing section behaves like append (creates it); missing options exit 1.'
    acceptance:
      - given: 'no ## Four'
        when: 'sdk-doc rewrite <file> --section "## Four" --content fourth'
        then: 'file contains ## Four + fourth'
    sources: [{file: scripts/commands/rewrite.js, lines: '7-19'}]
    conformance: [cap-doc-rewrite-002]

  - id: cap-doc-add-item-001
    kind: capability
    status: built
    statement: 'add-item appends a checklist item at the end of a section: [ ] pending (default), [x] done, [!] blocked.'
    acceptance:
      - given: '## Pending with one item, then ## Done'
        when: 'add-item three times with no --status, --status done, --status blocked'
        then: 'section ends - [ ] p1, - [x] d1, - [!] b1, before ## Done'
    sources: [{file: scripts/commands/add-item.js, lines: '11-52'}]
    conformance: [cap-doc-add-item-001]

  - id: cap-doc-add-item-002
    kind: capability
    status: built
    statement: 'add-item to a missing plain section creates that section at the end of the file with the item.'
    fixed_note: "2026-11-14: a missing section given with its own \"#\" level (e.g. \"## Risks\") is created as written, like append; only a bare name gets \"### \"."
    acceptance:
      - given: 'no Notes / ## Risks section'
        when: 'sdk-doc add-item <file> --section Notes --item n1; then --section "## Risks" --item r1'
        then: 'file ends with ### Notes + - [ ] n1, and with ## Risks + - [ ] r1'
    sources: [{file: scripts/commands/add-item.js, lines: '33-37'}]
    conformance: [cap-doc-add-item-002]

  # ─── decision / log ─────────────────────────────────────────────────────────
  - id: cap-doc-decision-001
    kind: capability
    status: built
    statement: 'decision appends a structured entry (### Decision heading, YAML comment block, field table) under the decisions section, creating ## Decision History if absent; defaults release current, reversible unknown, domain inferred from --made-by.'
    acceptance:
      - given: 'a template history.md'
        when: 'sdk-doc decision history.md --decision "Use Postgres..." --context "ACID needed" --made-by CTO'
        then: '## Decision History + ### Decision: ... + comment with release "current", made_by "CTO", domain "engineering", reversible: unknown; exit 0'
      - given: 'an existing Decision History'
        when: 'a second decision with --release --reversible --rationale --domain'
        then: 'values written, still one ## Decision History'
    sources: [{file: scripts/commands/decision.js, lines: '5-73'}]
    conformance: [cap-doc-decision-001]

  - id: cap-doc-decision-002
    kind: capability
    status: built
    statement: 'decision warns (non-blocking) when the new decision shares ≥2 words of 4+ letters with an existing decision in the same domain.'
    acceptance:
      - given: 'Use Postgres for ledger storage (engineering)'
        when: 'decision "Use Postgres replicas for ledger reads" --made-by Mario'
        then: 'stdout Potential conflicts with existing decisions + the earlier decision; exit 0'
    sources: [{file: scripts/commands/decision.js, lines: '75-113'}]
    conformance: [cap-doc-decision-002]

  - id: cap-doc-decision-003
    kind: capability
    status: built
    statement: 'decision without --decision, --context and --made-by exits 1.'
    acceptance:
      - given: 'no --made-by'
        when: 'sdk-doc decision history.md --decision x --context y'
        then: 'stderr Missing required options: --decision, --context, --made-by; exit 1'
    sources: [{file: scripts/commands/decision.js, lines: '6-9'}]
    conformance: [cap-doc-decision-003]

  - id: cap-doc-log-001
    kind: capability
    status: built
    statement: 'log appends a dated area-log entry (## <date> <role> <level>, Goal/Change, Expected outcome, Requirements discovered, Status upper-cased; defaults —, None, ACTIVE) after a --- separator.'
    acceptance:
      - given: 'engineering-log.md'
        when: 'sdk-doc log engineering-log.md --role EM --level M1 --goal "Pod-A done" --status completed'
        then: 'file ends with ---, ## <today> EM M1, Goal/Change: Pod-A done, Expected outcome: —, Requirements discovered: None, Status: COMPLETED'
    sources: [{file: scripts/commands/log.js, lines: '11-27'}]
    conformance: [cap-doc-log-001]

  - id: cap-doc-log-002
    kind: capability
    status: built
    statement: 'log without --role, --level and --goal exits 1.'
    acceptance:
      - given: 'no --goal'
        when: 'sdk-doc log <file> --role EM --level M1'
        then: 'stderr Missing required options: --role, --level, --goal; exit 1'
    sources: [{file: scripts/commands/log.js, lines: '6-9'}]
    conformance: [cap-doc-log-002]

