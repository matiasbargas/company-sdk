# Layer B capabilities — portfolio-orchestrator
#
# Each capability is an implementation-independent promise with acceptance criteria written as
# given/when/then against the public interface (CLI, files, runner contract), never internals.
# `status: planned` may have no conformance tests yet; `status: built` MUST list ≥1 test id, and
# every listed id must appear as `@covers <id>` in a test file (enforced by
# scripts/lib/test-capability-coverage.js in npm test). Rewrite the code freely; keep these green.
#
# Variables: variables.yaml (same folder). Sources: intent/portfolio-orchestrator/*.

claims:
  - id: cap-po-registry-001
    kind: capability
    status: built
    statement: "The holding keeps a registry of companies, each with its own Owner, path, and runner; a company entry without an Owner is rejected."
    acceptance:
      - given: "a portfolio.json with a company missing `owner`"
        when: "the registry is validated"
        then: "validation fails naming the company and the missing field"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "The shape everyone converged on"}]
    conformance: [cap-po-registry-001]

  - id: cap-po-ledger-001
    kind: capability
    status: built
    statement: "The fuel ledger is append-only, hash-chained, and idempotent; replaying an event does not change any balance."
    acceptance:
      - given: "a ledger with N events"
        when: "the same draw event (same idem_key) is ingested twice"
        then: "the ledger has N+1 events and balances equal a single ingestion"
      - given: "a ledger whose line k was edited"
        when: "the chain is verified"
        then: "verification fails at line k"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft, 3. Ledger"}]
    conformance: [cap-po-ledger-001]

  - id: cap-po-ledger-002
    kind: capability
    status: built
    statement: "Only the holding Owner can fund the pool; no other actor can write a `fund` event."
    acceptance:
      - given: "a `fund` event authored by any role other than the holding Owner"
        when: "it is appended"
        then: "it is rejected and nothing is written"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "The shape everyone converged on"}]
    conformance: [cap-po-ledger-002]

  - id: cap-po-fuel-001
    kind: capability
    status: built
    statement: "Fuel is metered by the runner from stream-json `result.modelUsage` (per model), never from top-level `usage`, in raw tokens by type; each session's fixed overhead counts; Fuel Units and USD are derived views recomputable from raw."
    acceptance:
      - given: "a run whose result carries usage {input, output, cache_write, cache_read, model}"
        when: "the runner records it"
        then: "the ledger draw stores raw counts from modelUsage and FU equals raw × fuel.priceTable"
      - given: "a result whose top-level `usage` is all zeros but `modelUsage` has counts (observed in the 2026-11-13 spike)"
        when: "the runner records it"
        then: "the draw uses the modelUsage counts, not zero"
      - given: "a session with no usage record"
        when: "it is reconciled"
        then: "it is recorded as `unmetered`, never as zero"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 1. Units"}, {file: record/experiments/2026-11-13-metering-spike/README.md, section: "Results"}]
    conformance: [cap-po-fuel-001]

  - id: cap-po-fuel-002
    kind: capability
    status: built
    statement: "Infinite fuel is an option: with `limits.fuel.envelopePerCycle: null` the pool never exhausts, while every draw is still metered and tranche gating and kill conditions still apply."
    acceptance:
      - given: "envelopePerCycle is null"
        when: "draws exceed any finite amount"
        then: "no draw is refused for pool balance, every draw is in the ledger, a draw beyond an unproven tranche is still refused, and a grant without a kill condition is still malformed"
    sources: [{file: history.md, section: "Portfolio Orchestrator — Discovery decisions (Owner: infinite fuel should be an option)"}]
    conformance: [cap-po-fuel-002]

  - id: cap-po-grant-001
    kind: capability
    status: built
    statement: "A grant must declare tranches, a named proof per tranche, and a kill condition; only tranche 1 is drawable at grant time."
    acceptance:
      - given: "a grant request without a kill condition"
        when: "it is submitted"
        then: "it is rejected as malformed"
      - given: "a ratified grant with three tranches"
        when: "a draw is attempted beyond tranche 1"
        then: "the draw is refused until tranche 1's named proof is recorded"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft, 2. Lifecycle"}]
    conformance: [cap-po-grant-001]

  - id: cap-po-proof-001
    kind: capability
    status: built
    statement: "A tranche releases on a pass/fail check of its named proof (verified surface, graduated cycle, or Owner-approved ship) identified by commit SHA; one proof unlocks at most one tranche."
    acceptance:
      - given: "tranche 1's named proof is a surface that reaches `verified` at SHA s"
        when: "the proof is recorded"
        then: "tranche 2 becomes drawable, and recording the same surface again unlocks nothing further"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft, 2. Lifecycle"}]
    conformance: [cap-po-proof-001]

  - id: cap-po-proof-002
    kind: capability
    status: built
    statement: "v0 accepts the company's own gates as proof (system autonomy, Owner decision 2026-11-13); the Goodhart risk is recorded and the outside-verifier rule activates when the revisit trigger fires."
    acceptance:
      - given: "a second human Owner is registered, OR in 2 consecutive cycles divergence is flagged (within a bet class of ≥ 3 bets, ≥ 50% of above-class-median-VOF bets rated flat/regressed, unrated bets counting as divergent)"
        when: "sdk-health runs on the holding"
        then: "it reports that the outside-verifier decision is due (proof self-verification risk)"
    sources: [{file: history.md, section: "Portfolio Orchestrator — Discovery decisions"}]
    # sdk-health surface: packages/holding/src/health.js holdingHealth() (scripts/health.js calls it)
    conformance: [cap-po-proof-002]

  - id: cap-po-runner-001
    kind: capability
    status: built
    statement: "The runner refuses to start a run when the company has no open tranche (with or without infinite fuel), and stops at a turn boundary when the working budget is spent, leaving the repository committed or clean."
    acceptance:
      - given: "a company whose open tranche is exhausted"
        when: "start(companyId) is called"
        then: "it returns a refusal naming the grant; no session starts"
      - given: "a running session that exhausts its working budget"
        when: "the next tool call is attempted"
        then: "work tools are denied with a landing message; git/status writes still succeed; no .git/index.lock remains"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "v0 gates"}]
    conformance: [cap-po-runner-001]

  - id: cap-po-runner-002
    kind: capability
    status: planned
    statement: "Instances never write the ledger or report their own burn; the runner is the single writer."
    acceptance:
      - given: "an agent inside a company attempts to append to holding/fuel/ledger.jsonl"
        when: "the write is attempted"
        then: "it is denied by the OS: company sessions run as the dedicated sandbox user, and holding/ (ledger, settings, hooks, kill switch, commons, keys) is owned by the Owner's user with mode 0700 (Owner decision D7, 2026-11-14)"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "The shape everyone converged on"}]
    conformance: []

  - id: cap-po-isolation-001
    kind: capability
    status: planned
    statement: "Company sessions run as one dedicated unprivileged OS user (the sandbox user), launched by the runner through a narrow sudo rule with the company key passed per session; the runner and holding/ stay under the Owner's user (0700). Companies are separated from each other by clone + permission rules in v0; per-company OS users or containers are required before any company of another Owner is registered."
    acceptance:
      - given: "two registered companies A and B"
        when: "a session in A attempts to read or edit B's path through Read/Edit/Write tools"
        then: "permission rules deny it; reaching the holding/ control plane is denied by the OS (sandbox user); sibling-company reach via Bash remains a documented v0 limit until per-company users"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "v0 gates"}]
    conformance: []

  - id: cap-po-commons-001
    kind: capability
    status: built
    statement: "The commons (under holding/, unreachable by the sandbox user) is pull-only: an item enters only through a §34 surface verified by another company's roster plus the CISO (never only its own), sits in quarantine until verified, is content-addressed, never carries settings/hooks/CHARTER/scripts, and is adopted by a company only on its Owner's approval; a local edit is never overwritten (conflict opens a reconciling surface)."
    acceptance:
      - given: "a verified skill item in the commons and company B subscribed to `skill`"
        when: "B pulls with Owner approval"
        then: "B's commons.lock.json records {item, hash, surface_id} and the file content matches the hash"
      - given: "B edited that skill locally"
        when: "B pulls a newer version"
        then: "nothing is overwritten and a `reconciling` surface is opened"
      - given: "a commons item whose verifying surface roster contains only the publishing company's roles"
        when: "admission is attempted"
        then: "it is refused: an outside verifier (another company) and the CISO are required"
      - given: "an item that contains a settings.json or hook"
        when: "it is published"
        then: "it is rejected"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "The shape everyone converged on"}]
    conformance: [cap-po-commons-001]

  - id: cap-po-commons-002
    kind: capability
    status: built
    statement: "Publishing context to the commons requires a consent record signed by the company Owner and passes secret and PII scans; it is treated as irreversible."
    acceptance:
      - given: "a published-context item without a consent record, or failing the secret/PII scan"
        when: "it is published"
        then: "it is rejected with the failing check named"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "v0 gates"}]
    conformance: [cap-po-commons-002]

  - id: cap-po-killswitch-001
    kind: capability
    status: built
    statement: "The holding Owner can halt any instance and freeze the ledger; a frozen ledger accepts no draws."
    acceptance:
      - given: "the ledger is frozen"
        when: "any draw is attempted"
        then: "it is refused; running sessions reach landing mode at the next turn boundary"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "v0 gates"}]
    conformance: [cap-po-killswitch-001]

  - id: cap-po-metric-001
    kind: capability
    status: built
    statement: "VOF is reported per company and per bet, fully loaded, only compared within a bet class, always beside the company Owner's judgment; a cycle with unmetered sessions suppresses that company's VOF."
    acceptance:
      - given: "company A had one unmetered session in the cycle"
        when: "the ledger report runs"
        then: "A's VOF is shown as suppressed with the reason"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft, 6. Metric"}]
    conformance: [cap-po-metric-001]

  - id: cap-po-budget-001
    kind: capability
    status: built
    statement: "A per-run budget flag is a soft ceiling (checked after a turn); overshoot is recorded as an `overrun` paid from the overrun reserve and recovered from the next tranche; the provider-side key cap is the hard ceiling."
    acceptance:
      - given: "a run capped at X whose single turn costs more than X (observed: $0.05 cap ended at $0.084)"
        when: "the runner records it"
        then: "the ledger has a `draw` up to the cap and an `overrun` for the excess, and the next tranche is reduced by the overrun"
    sources: [{file: record/experiments/2026-11-13-metering-spike/README.md, section: "Results"}]
    conformance: [cap-po-budget-001]

  - id: cap-po-grant-002
    kind: capability
    status: built
    statement: "A grant becomes drawable only after the holding Owner ratifies it; agents can propose but never ratify."
    acceptance:
      - given: "a grant approved at the Betting Table but not ratified by the holding Owner"
        when: "a draw is attempted"
        then: "it is refused"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 2. Lifecycle"}]
    conformance: [cap-po-grant-002]

  - id: cap-po-grant-003
    kind: capability
    status: built
    statement: "Unspent fuel returns to the pool on close or kill, and is reclaimed after `fuel.reclaimCyclesWithoutProof` Betting cycles without new proof; returned fuel is credited to the company's next request."
    acceptance:
      - given: "a grant with undrawn FU and no proof for reclaimCyclesWithoutProof cycles"
        when: "the cycle closes"
        then: "a `reclaim` event returns the undrawn FU to the pool"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 7. Guardrails"}]
    conformance: [cap-po-grant-003]

  - id: cap-po-proof-003
    kind: capability
    status: built
    statement: "Proof reverted within `fuel.proofRevertCommits` commits is clawed back from the metric and cannot unlock a further tranche."
    acceptance:
      - given: "a verified surface that unlocked tranche 2 and is reverted 3 commits later"
        when: "the ledger report runs"
        then: "its weight is removed from VOF and a `proof` reversal event is recorded"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 7. Guardrails"}]
    conformance: [cap-po-proof-003]

  - id: cap-po-reserve-001
    kind: capability
    status: built
    statement: "With a finite envelope, `fuel.smallBetReserve` of the pool is held for grants up to `fuel.smallBetMax`, and `fuel.overrunReserve` for overruns; overruns stop when the reserve is empty."
    acceptance:
      - given: "a finite envelope where large grants would consume all non-reserved fuel"
        when: "a small grant is requested"
        then: "it is funded from the small-bet reserve"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 6–7"}]
    # overrun stop = shared pre-flight (src/preflight.js, OVERRUN_RESERVE_EMPTY) used by the runner and sdk-holding; limits come from ledger `limits` events
    conformance: [cap-po-reserve-001]

  - id: cap-po-runner-003
    kind: capability
    status: built
    statement: "The runner caps parallel sessions at `limits.fuel.concurrency` and holds one lock per company, so a repository never has two writer sessions; it never runs with skip-permissions."
    acceptance:
      - given: "concurrency 2 and three queued runs"
        when: "the runner schedules them"
        then: "at most two run at once, never two in the same company, and no run uses --dangerously-skip-permissions or bypassPermissions"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "v0 gates"}]
    conformance: [cap-po-runner-003]

  - id: cap-po-registry-002
    kind: capability
    status: built
    statement: "The registry refuses a company whose Owner differs from the holding Owner until the second-Owner gates hold (OS-level isolation, ratified multi-Owner CHARTER amendment, CLO gate items), and refuses any company whose CHARTER is unratified."
    acceptance:
      - given: "the gates are not met"
        when: "a company with a different Owner is added"
        then: "it is refused, naming each unmet gate"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "Regulatory map (CLO), with confidence"}]
    conformance: [cap-po-registry-002]

  - id: cap-po-commons-003
    kind: capability
    status: built
    statement: "Any commons item can be recalled by publishing a revocation entry; companies that adopted it are told, and history is never rewritten."
    acceptance:
      - given: "an adopted item is revoked"
        when: "a subscribed company pulls"
        then: "it sees the revocation, the item is quarantined locally, and its lockfile records the revocation"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "The shape everyone converged on"}]
    conformance: [cap-po-commons-003]

  - id: cap-po-data-001
    kind: capability
    status: built
    statement: "In v0 no personal data enters any company or the commons; publication runs deterministic secret and PII scans and is refused on any finding."
    acceptance:
      - given: "a published-context item containing an email address or an API key pattern"
        when: "it is published"
        then: "it is refused naming the finding"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "Regulatory map (CLO), with confidence"}]
    conformance: [cap-po-data-001]

  - id: cap-po-judgment-001
    kind: capability
    status: built
    statement: "Each cycle the company Owner rates every funded bet advanced | flat | regressed; the ledger report shows the rating beside VOF and flags divergence (≥ 50% of above-median-VOF bets rated flat or regressed)."
    acceptance:
      - given: "a bet class with 6 funded bets where 2 of the 3 above-class-median-VOF bets are rated flat"
        when: "the ledger report runs"
        then: "divergence is flagged for that class and cycle"
      - given: "a funded bet with no Owner rating at cycle close"
        when: "the ledger report runs"
        then: "the bet counts as divergent and sdk-health flags the unfilled judgment column"
      - given: "a bet class with only 2 funded bets"
        when: "the ledger report runs"
        then: "divergence is not computed for that class (below the minimum)"
    sources: [{file: intent/portfolio-orchestrator/discovery-synthesis.md, section: "§36 draft v0.2, 8. Metric and the judgment column"}]
    # sdk-health surface: packages/holding/src/health.js holdingHealth() (scripts/health.js calls it)
    conformance: [cap-po-judgment-001]

  - id: cap-po-runner-004
    kind: capability
    status: built
    statement: "The runner launches sessions with a clean environment (nothing inherited from the Owner's shell or user settings except what the runner passes), pins the model through runner-owned settings, and aborts a session at its `system:init` event when the resolved model differs from the grant's model, before any spend."
    acceptance:
      - given: "the Owner's environment sets ANTHROPIC_MODEL to a different model than the grant (observed in spike 2)"
        when: "the runner starts a session"
        then: "the child environment does not contain ANTHROPIC_MODEL, and if init reports a model other than the grant's, the run stops with terminalReason model_mismatch and no draw"
    sources: [{file: record/experiments/2026-11-14-metering-spike-2/README.md, section: "Observations"}]
    conformance: [cap-po-runner-004]

  - id: cap-po-runner-005
    kind: capability
    status: built
    statement: "The runner refuses a run whose per-run budget cap is below the pinned model's session floor (fixed per-session overhead), because such a cap is overshot on the first turn."
    acceptance:
      - given: "a model whose recorded session floor is ~$0.08 and a run cap of $0.02"
        when: "start is called"
        then: "it is refused naming the floor"
    sources: [{file: record/experiments/2026-11-14-metering-spike-2/README.md, section: "Observations"}]
    conformance: [cap-po-runner-005]

  - id: cap-po-reconcile-001
    kind: capability
    status: built
    statement: "Each cycle, ledger draws per company key are reconciled against the provider's usage for that key; the difference (e.g. killed runs with no visible usage) is recorded as an `unmetered` reconciliation event, never ignored."
    acceptance:
      - given: "provider usage for a key exceeds the ledger's draws for that key in a cycle"
        when: "reconciliation runs"
        then: "an unmetered event records the difference with the provider evidence reference"
    sources: [{file: record/experiments/2026-11-14-metering-spike-2/README.md, section: "Observations"}]
    conformance: [cap-po-reconcile-001]

  - id: cap-po-sandbox-001
    kind: capability
    status: built
    statement: "Company sessions run as a dedicated sandbox OS user launched through a narrow sudo rule with a clean env and the company key injected per session; holding/ (ledger, keys, settings, freeze flag) is owned by the Owner (0700) and unreachable by the sandbox user; `run` refuses without a configured sandbox (Owner decision D7, one company, 2026-11-15)."
    acceptance:
      - given: "a holding with a `sandbox` event {user, home} and a 0600 key file"
        when: "a run starts"
        then: "the spawn is `sudo -n -u <user> -H --preserve-env=ANTHROPIC_API_KEY,HOLDING_RUN_ID <claude> ...` with the key only in the spawn environment (never in any argv element), the spawn env is exactly {PATH, ANTHROPIC_API_KEY, HOLDING_RUN_ID}, and session files live in an Owner-owned 0755/0644 directory outside holding/"
      - given: "no sandbox configured"
        when: "a run is requested"
        then: "it is refused with SANDBOX_REQUIRED"
      - given: "the sandbox is configured"
        when: "`sdk-holding sandbox doctor` runs"
        then: "each check (user, holding mode/owner, company writable, key 0600, sudo rule) passes or names its fix"
    sources: [{file: history.md, section: "Implementation Guardian cycle 1 + Owner clarification (2026-11-15)"}]
    conformance: [cap-po-sandbox-001]

  - id: cap-po-runner-006
    kind: capability
    status: built
    statement: "Runner-owned settings carry an explicit permission profile (read, edit within the company root, a git subcommand allowlist, the project test command) so a real headless session can work and land; permission denials are recorded, and a session that achieved nothing because of denials ends `no_work_denied`, never `done`; the landing hook's git exception refuses -c/config/aliases/command chaining."
    acceptance:
      - given: "a session whose every tool call was denied"
        when: "it ends"
        then: "terminalReason is no_work_denied and the denials are in the run record"
      - given: "landing mode"
        when: "the session runs `git -c alias.x='!cmd' x` or `git commit -m x; rm -rf .`"
        then: "the hook denies it"
    sources: [{file: iterations/implementation/holding/iter-001.md, section: "Guardian Review"}]
    conformance: [cap-po-runner-006]

  - id: cap-po-hook-integrity-001
    kind: capability
    status: built
    statement: "The landing hook cannot be stale or tampered with: the setup script proves, as the sandbox user, that the installed hook denies a Write in landing state (aborting otherwise), and before every run the pre-flight refuses HOOK_STALE when the installed hook's sha256 differs from the repo copy, or HOOK_WRITABLE when the sandbox user could write the hook or any non-sticky parent folder."
    acceptance:
      - given: "an installed hook edited after setup"
        when: "a run starts"
        then: "it is refused with HOOK_STALE naming both paths and the reinstall command; nothing spawns"
    sources: [{file: intent/portfolio-orchestrator/v0.2-deliverables.md, section: "D1.1, D1.2"}]
    conformance: [cap-po-hook-integrity-001]

  - id: cap-po-firstrun-001
    kind: capability
    status: built
    statement: "Until a company has one completed real run, landing uses the short ledger limit `firstRunLandingTimeoutSec` (default 60 s); `sdk-holding run --landing-timeout <s>` overrides it; every run record names the deadline and its source."
    acceptance:
      - given: "a company with no completed real run"
        when: "a run lands"
        then: "the landing deadline is firstRunLandingTimeoutSec and the run record says source first_run"
    sources: [{file: intent/portfolio-orchestrator/v0.2-deliverables.md, section: "D1.3"}]
    conformance: [cap-po-firstrun-001]

  # ── Second-company gate (D3, design only — planned until the Owner ratifies the CHARTER amendment) ──
  - id: cap-po-second-owner-001
    kind: capability
    status: planned
    statement: "Each company runs as its own sandbox OS user and group; the runner selects the user from that company's `sandbox` ledger event and refuses a run when the company has none or when two companies share a user, group, home or session root."
    acceptance:
      - given: "companies A and B registered, and only A has a `sandbox` event"
        when: "a run for B is started"
        then: "it is refused with SANDBOX_REQUIRED naming company B, and no process is spawned"
      - given: "A and B whose `sandbox` events name the same OS user (or the same home or session root)"
        when: "a run for either is started"
        then: "it is refused with SANDBOX_SHARED naming both companies and the shared field"
      - given: "A and B with distinct sandbox users _sdkco_a and _sdkco_b"
        when: "a run for B is started"
        then: "the spawn is `sudo -n -u _sdkco_b -H --preserve-env=...` and never names _sdkco_a"
    sources: [{file: intent/portfolio-orchestrator/second-company/isolation.md, section: "4. How the runner selects the user per company"}]
    conformance: []

  - id: cap-po-second-owner-002
    kind: capability
    status: planned
    statement: "No company's sandbox user can reach another company's clone, home, session root or temp folder, nor holding/; the pre-flight checks it from file modes and the setup script proves it live as each user; run files are private to their company."
    acceptance:
      - given: "company B's clone is readable by the other class (o+r on the clone and every parent)"
        when: "a run for A is started"
        then: "it is refused with SANDBOX_CROSS_REACH naming A, B and the path"
      - given: "a holding with A configured and B being added"
        when: "`sdk-holding sandbox setup --company b` writes the setup script"
        then: "the script contains, for every path of A, a `sudo -u _sdkco_b /bin/test -r <path>` that aborts the script with the path named if it succeeds"
      - given: "a sandboxed run for company A"
        when: "the runner writes the run's settings and landing state"
        then: "they live under a session root owned by the Owner with group _sdkco_a and mode 0750, the files are 0640, and the spawn passes a TMPDIR that is private to _sdkco_a"
    sources: [{file: intent/portfolio-orchestrator/second-company/isolation.md, section: "3. Mechanisms (macOS)"}, {file: intent/portfolio-orchestrator/second-company/isolation.md, section: "6. What stays unreachable across companies"}]
    conformance: []

  - id: cap-po-second-owner-003
    kind: capability
    status: planned
    statement: "Every company has its own provider key, different from every other company's, stored Owner-only inside holding/ and unreachable by every sandbox user."
    acceptance:
      - given: "holding/keys/a.key and holding/keys/b.key with identical content"
        when: "a run for A or B is started"
        then: "it is refused with KEY_SHARED naming both companies, and no key material appears in the output"
      - given: "a holding with two companies"
        when: "`sdk-holding sandbox doctor` runs"
        then: "for each sandbox user it reports whether that user can reach any file under holding/keys, and fails naming the user and the path when it can"
    sources: [{file: intent/portfolio-orchestrator/second-company/isolation.md, section: "5. How keys stay per company (C14)"}]
    conformance: []

  - id: cap-po-second-owner-004
    kind: capability
    status: planned
    statement: "A company's session environment (and the key in it) is not visible to another company's sandbox user, and the key is not persisted outside the company's private home; both are proven, not assumed."
    acceptance:
      - given: "two configured sandbox users _sdkco_a and _sdkco_b"
        when: "the generated setup script for B runs"
        then: "it starts a probe process as _sdkco_a with a random variable in its environment, runs `ps -E -ww -p <pid>` as _sdkco_b, and aborts naming the probe if the variable is visible"
      - given: "a holding whose first sandboxed run for a second-Owner company has finished"
        when: "the registry evaluates gate G17"
        then: "it is unmet until a signed `gate_attest` record for G17 states the result of searching the company home for the key suffix"
    sources: [{file: intent/portfolio-orchestrator/second-company/isolation.md, section: "5. How keys stay per company (C14)"}]
    conformance: []

  - id: cap-po-second-owner-005
    kind: capability
    status: planned
    statement: "The location and scope of each company's provider spend cap is recorded as a holding-Owner `provider_caps` event; in a holding with two or more companies a run is refused without one (infinite fuel included), and companies whose cap scope is a workspace must name different workspaces."
    acceptance:
      - given: "a holding with two companies and no `provider_caps` event for company B"
        when: "a run for B is started"
        then: "it is refused with PROVIDER_CAP_UNVERIFIED naming B, also when envelopePerCycle is null"
      - given: "`provider_caps` events for A and B with scope workspace and the same workspace id"
        when: "a run for either is started"
        then: "it is refused with WORKSPACE_SHARED"
      - given: "a `provider_caps` event with scope org or enforcement alert"
        when: "a company of a different Owner is added"
        then: "it is refused naming gate G18 and the outcome (O4 or O5)"
    sources: [{file: intent/portfolio-orchestrator/second-company/provider-caps.md, section: "3. Decision table"}]
    conformance: []

  - id: cap-po-second-owner-006
    kind: capability
    status: planned
    statement: "Where a company Owner is not the holding Owner, every Owner act recorded by software (grant acceptance, adoption approval, consent record, judgment rating, CHARTER ratification, gate attestation) counts only with a signature that verifies against that Owner's public key in the registry; the holding Owner cannot sign as the company Owner."
    acceptance:
      - given: "company B with Owner bob and bob's public key in the registry"
        when: "`commons pull b --approve` is given an approval signed by the holding Owner's key"
        then: "it is refused naming the expected signer, and nothing is copied"
      - given: "a judgment rating for a bet of B carrying no signature"
        when: "it is recorded"
        then: "it is refused, and the bet remains unrated (it still counts as divergent)"
      - given: "a single-Owner holding (every company Owner is the holding Owner)"
        when: "the same acts are recorded without signatures"
        then: "they are accepted as today"
    sources: [{file: intent/portfolio-orchestrator/second-company/charter-amendment-proposal.md, section: "A. New section — Owners (Proof of an Owner's act)"}]
    conformance: []

  - id: cap-po-second-owner-007
    kind: capability
    status: planned
    statement: "The second-Owner gate is computed, not flagged: the registry recomputes every code row of the gate checklist and reads every attestation row from signed `gate_attest` ledger events; `second_owner_gates` booleans in portfolio.json no longer satisfy any gate."
    acceptance:
      - given: "portfolio.json with every second_owner_gates flag set true and no gate_attest events"
        when: "a company with a different Owner is added"
        then: "it is refused, naming every unmet row (G-number, condition, and whether it is a code check or an attestation)"
      - given: "a gate_attest event for G4 signed by someone other than the holding Owner"
        when: "the registry evaluates G4"
        then: "G4 is unmet and the wrong signer is named"
    sources: [{file: intent/portfolio-orchestrator/second-company/gate-checklist.md, section: "Checklist"}]
    conformance: []

  - id: cap-po-second-owner-008
    kind: capability
    status: planned
    statement: "The registry refuses a second Owner until the holding's CHARTER carries a ratified Owners section defining the holding Owner and the company Owner."
    acceptance:
      - given: "the holding CHARTER.md has a signed ratification line but no `## Owners` section"
        when: "a company with a different Owner is added"
        then: "it is refused naming gate G1 and the missing section"
      - given: "the holding CHARTER.md has an `## Owners` section but its ratification line is unsigned"
        when: "a company with a different Owner is added"
        then: "it is refused naming gate G1 and the unsigned line"
    sources: [{file: intent/portfolio-orchestrator/second-company/charter-amendment-proposal.md, section: "Proposed text"}]
    conformance: []

  - id: cap-po-second-owner-009
    kind: capability
    status: planned
    statement: "In a holding with two or more companies, every company's key is reconciled against provider usage every cycle; a company left unreconciled at cycle close cannot draw its next tranche until it is reconciled."
    acceptance:
      - given: "two companies and a cycle closed with a `reconcile` event for A only"
        when: "a run for B is started in the next cycle"
        then: "it is refused with UNRECONCILED naming B and the cycle, and a run for A is not affected"
      - given: "the same holding after `sdk-holding reconcile --company b --period <cycle> ...`"
        when: "a run for B is started"
        then: "the reconciliation refusal no longer applies"
    sources: [{file: intent/portfolio-orchestrator/second-company/provider-caps.md, section: "3. Decision table (O7)"}, {file: intent/portfolio-orchestrator/second-company/isolation.md, section: "8. Mapping to Mario's conditions"}]
    conformance: []

  - id: cap-po-calibration-001
    kind: capability
    status: built
    statement: "`sdk-holding calibration [--json]` joins, per bet, VOF, the company Owner's rating, kills and §29 disagreements linked to the grant or mission; it is read-only and never writes the ledger."
    acceptance:
      - given: "a ledger with funded, rated, killed and disputed bets"
        when: "calibration runs"
